# Builds the add-on and tables on every push and pull request.
# Pushing a tag such as v1.0.0 also publishes a release with QQMusicEnglish.zip attached.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: QQMusicEnglish
          path: dist/QQMusicEnglish
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/QQMusicEnglish.zip --title "${{ github.ref_name }}" --generate-notes
